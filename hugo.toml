baseURL = 'https://go-units.github.io/'
locale  = 'en-us'
title   = 'go-units'
# No theme -- the layout is the go-* family template: one self-contained
# layouts/index.html, and the shared design (styles, theme toggle, fork ribbon,
# icons) imported as the Hugo module github.com/go-fleettools/landingkit,
# pinned in go.mod.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-units: units and physical constants in pure Go (CGO=0). Planned, wave 2 of the go-scikit roadmap: no library exists yet."

# Every field below is rendered by layouts/index.html (cards in #repos, the
# strip under the hero). A field nothing renders does not stay true.
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-units.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): the scope of the organisation, the plan and one page per planned package. <a href=\"https://github.com/go-units/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-units/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The planned packages. None exists: each statement is from the roadmap's
# bibliography (go-scikit/roadmap, bib/systems-units-formats-visualization.md).
[[params.packages]]
  name  = "units"
  kind  = "planned (wave 2)"
  blurb = "A dimension vector of rational exponents, quantities and conversion, a parser for the UDUNITS grammar, SI, US customary and derived units, offset units (degC, degF) and dimensional analysis. User-defined unit systems (EMU, ESU, atomic) follow in wave 4. Validated against pint, astropy and NIST SP 811."
[[params.packages]]
  name  = "constants"
  kind  = "planned (wave 2)"
  blurb = "The CODATA 2022 recommended values, generated from NIST's ASCII table by a reproducible tool that records the edition. Validated by a table diff against <code>allascii.txt</code> and against <code>scipy.constants</code>."

# The cards of #checks and their count come from this list. Each statement is
# a measure the roadmap says the work will be held to; none has been run.
[[params.checks]]
  name = "Exact dimensions"
  what = "Dimension vectors are exact rationals, compared for equality, never within a tolerance."
[[params.checks]]
  name = "Conversion factors"
  what = "Every conversion factor within 1 ulp of the decimal value in CODATA and NIST SP 811."
[[params.checks]]
  name = "Constants table"
  what = "A table diff against NIST's `allascii.txt`, with the CODATA edition recorded."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 5.84:1, bright on the dark background 8.75:1.
  base = "#5f6b12"
  deep = "#3a410b"
  bright = "#a3b84a"
  shadow = "rgba(95,107,18,.7)"
  glow = "rgba(95,107,18,.6)"
  wash = "rgba(95,107,18,.10)"
  washDeep = "rgba(58,65,11,.06)"
  chipBg = "#f4f6e9"
  chipBorder = "#e3eac9"
  chipFg = "#3a410b"
  chipBgDark = "rgba(163,184,74,.14)"
  chipBorderDark = "rgba(163,184,74,.32)"
  chipFgDark = "#ccd89b"
  statsEnd = "#e9eed4"
  bandText = "#f0f4e2"
